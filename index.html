<script>
"use strict";
const E = window.TTEngine;
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? "").replace(/[&<>"']/g, m => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[m]));

/* ================= Tetapan sambungan ================= */
const SUPABASE_URL_LALAI = "https://ifqgstspfxagzstccsin.supabase.co";
const SUPABASE_KEY_LALAI = ""; // tampal anon/publishable key di sini, atau isi melalui butang Projek > Sambungan
const JADUAL_HTML_URL = "https://skagamamiri.github.io/tools/jadual.html"; // jadual semasa ICT HUB
// Agihan Guru (agihan.html) — projek Supabase berasingan, dibaca dengan kunci anon (baca sahaja)
const AGIHAN_URL = "https://upeohhckgenamwggajip.supabase.co";
const AGIHAN_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVwZW9oaGNrZ2VuYW13Z2dhamlwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQyMjg0ODIsImV4cCI6MjEwOTgwNDQ4Mn0.4aHGDElXA7FtkdFTebMapeeUe8AOG-OuktF9UAp6mbg";
const K_CFG = "janajadual_cfg", K_LOCAL = "janajadual_projek", K_KUNCI = "janajadual_kunci";
function bacaLS(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } }
function tulisLS(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
let cfg = Object.assign({ url: SUPABASE_URL_LALAI, key: SUPABASE_KEY_LALAI }, bacaLS(K_CFG, {}));
if (!cfg.key) cfg.key = SUPABASE_KEY_LALAI;
let kunciAdmin = ""; try { kunciAdmin = sessionStorage.getItem(K_KUNCI) || ""; } catch (e) {}

/* ================= Keadaan ================= */
let P = bacaLS(K_LOCAL, null) || E.projekKosong("Jadual Baharu");
let tab = "ringkasan";
let paparan = { jenis: "induk-guru", id: null };
let pilihKad = null;
let sejarah = [];
let st = null;
let berubah = false;

function bina() { E.selaraskanKad(P); st = E.binaKeadaan(P); }
function simpanTempatan() { tulisLS(K_LOCAL, P); }
let tSimpan = null;
function ditukar() { berubah = true; clearTimeout(tSimpan); tSimpan = setTimeout(simpanTempatan, 400); kemasStatus(); }
function snap() { sejarah.push(JSON.stringify(P)); if (sejarah.length > 30) sejarah.shift(); }
function toast(m, ms) { const t = $("#toast"); t.textContent = m; t.style.display = "block"; clearTimeout(t._t); t._t = setTimeout(() => t.style.display = "none", ms || 2600); }

const byId = (arr, id) => arr.find(x => x.id === id);
const namaKelas = id => (byId(P.kelas, id) || {}).kod || "?";
const namaGuru = id => (byId(P.guru, id) || {}).nama || "?";
const singGuru = id => { const g = byId(P.guru, id); return g ? (g.singkatan || g.nama) : "?"; };
const subjekOf = id => byId(P.subjek, id) || { kod: "?", warna: "#64748b" };
// nama kelas bagi pelajaran: kelas gabungan "4A+4B", kumpulan "(A)"
const namaKelasP = p => E.kelasPel(p).map(namaKelas).join("+") + (p.kumpulan ? " (" + p.kumpulan + ")" : "");
const namaBilik = id => (byId(P.bilik, id) || {}).nama || "";
const bilikKad = (c, p) => (p && p.bilik) || c.bilik || "";
const masaLabel = n => n + " masa" + (P.tetapan.minitSlot ? " (" + (n * P.tetapan.minitSlot / 60).toFixed(1).replace(".0", "") + " j)" : "");

/* ================= Supabase REST ================= */
async function sb(path, opt) {
  if (!cfg.url || !cfg.key) throw new Error("Sambungan Supabase belum ditetapkan (Projek > Sambungan).");
  opt = opt || {};
  const r = await fetch(cfg.url.replace(/\/$/, "") + "/rest/v1/" + path, {
    method: opt.method || "GET",
    headers: Object.assign({ apikey: cfg.key, Authorization: "Bearer " + cfg.key, "Content-Type": "application/json" }, opt.headers || {}),
    body: opt.body ? JSON.stringify(opt.body) : undefined
  });
  const txt = await r.text();
  let data = null; try { data = txt ? JSON.parse(txt) : null; } catch (e) { data = txt; }
  if (!r.ok) throw new Error((data && (data.message || data.hint)) || ("HTTP " + r.status));
  return data;
}
const rpc = (fn, body) => sb("rpc/" + fn, { method: "POST", body });

async function pastikanKunci() {
  if (kunciAdmin) return kunciAdmin;
  const k = prompt("Kata laluan admin Jana Jadual:");
  if (!k) throw new Error("Dibatalkan");
  const ok = await rpc("tt_sahkan", { p_kunci: k });
  if (!ok) throw new Error("Kata laluan admin salah");
  kunciAdmin = k; try { sessionStorage.setItem(K_KUNCI, k); } catch (e) {}
  return k;
}

async function simpanAwan() {
  try {
    const k = await pastikanKunci();
    const id = await rpc("tt_simpan", { p_kunci: k, p_id: P._awanId || null, p_nama: P.nama, p_data: P });
    P._awanId = id; berubah = false; simpanTempatan(); kemasStatus();
    toast("Disimpan ke Supabase ✓");
  } catch (e) { if (/salah/.test(e.message)) { kunciAdmin = ""; try { sessionStorage.removeItem(K_KUNCI); } catch (x) {} } toast("Gagal simpan: " + e.message, 4500); }
}

/* ================= Analisis ================= */
function slotTersedia(k) { return E.availKelas(P.tetapan, k).flat().filter(Boolean).length; }
// masa kelas: pelajaran seluruh kelas + kumpulan terbesar (kumpulan berbeza boleh serentak)
function masaKelas(kid) {
  let asas = 0; const kump = {};
  for (const p of P.pelajaran) { if (!E.kelasPel(p).includes(kid)) continue; const m = Number(p.masa || 0); if (p.kumpulan) kump[p.kumpulan] = (kump[p.kumpulan] || 0) + m; else asas += m; }
  return asas + Math.max(0, ...Object.values(kump));
}
function bebanGuru(gid) { return P.pelajaran.filter(p => p.guru.includes(gid)).reduce((a, p) => a + Number(p.masa || 0), 0); }

const JENIS_ISU = { kelas: "Kelas bertembung", guru: "Guru bertembung", bilik: "Bilik bertembung", luar: "Di luar waktu / rehat / masa tidak tersedia", hadGuru: "Melebihi had masa sehari guru", hubungan: "Hubungan subjek dilanggar" };
function htmlSemakan(isu) {
  const belum = P.kad.filter(c => c.hari < 0);
  if (!isu.length && !belum.length) return `<div class="card"><h2>Semakan</h2><p><span class="pill ok">Tiada masalah</span> Semua kad diletak dan semua kekangan dipatuhi.</p></div>`;
  const t = P.tetapan, kira = {};
  isu.forEach(i => kira[i.jenis] = (kira[i.jenis] || 0) + 1);
  const siapa = i => i.jenis === "guru" || i.jenis === "hadGuru" ? namaGuru(i.siapa) : i.jenis === "bilik" ? namaBilik(i.siapa) : namaKelas(i.siapa);
  const kad = id => { const c = byId(P.kad, id), p = c && byId(P.pelajaran, c.pel); return p ? subjekOf(p.subjek).kod + " " + namaKelasP(p) : "?"; };
  const rows = isu.slice(0, 40).map(i => `<tr><td><span class="pill ${i.jenis === "luar" || i.jenis === "hubungan" ? "warn" : "bad"}">${esc(JENIS_ISU[i.jenis] || i.jenis)}</span></td><td>${esc(siapa(i))}</td>
    <td>${esc(t.hari[i.hari] || "")}${i.slot >= 0 ? " " + esc(E.masaSlot(t, i.slot)) : ""}</td><td class="small">${esc([...new Set(i.kad)].map(kad).join(", "))}</td></tr>`).join("");
  return `<div class="card"><h2>Semakan (Verification)</h2>
    <div class="row" style="flex-wrap:wrap;gap:6px">${Object.entries(kira).map(([j, n]) => `<span class="pill ${j === "luar" || j === "hubungan" ? "warn" : "bad"}">${esc(JENIS_ISU[j] || j)}: ${n}</span>`).join("")}${belum.length ? `<span class="pill warn">${belum.length} kad belum diletak</span>` : ""}</div>
    ${rows ? `<div class="scroll" style="margin-top:8px"><table class="simple"><tr><th>Masalah</th><th>Siapa</th><th>Bila</th><th>Kad</th></tr>${rows}</table></div>${isu.length > 40 ? `<p class="muted small">… dan ${isu.length - 40} lagi.</p>` : ""}` : ""}</div>`;
}

/* --- import jadual.html --- */
async function bacaJadualHtml(src) {
  const a = src.indexOf("const VERSION_DATA"), s = src.indexOf("[", a), e = src.indexOf("\n];", s);
  if (a < 0 || s < 0 || e < 0) throw new Error("Format jadual.html tidak dikenali");
  const versions = new Function("return " + src.slice(s, e + 2))();
  const m = /const\s+DEFAULT_VERSION_ID\s*=\s*["']([^"']+)["']/.exec(src);
  return { versions, lalai: m ? m[1] : versions[versions.length - 1].id };
}
let _versi = null;
async function dlgImportJadual() {
  modal(`<h2>Import daripada jadual.html</h2><p class="muted">Memuatkan senarai versi…</p><div class="row"><button data-tutup>Tutup</button></div>`);
  try {
    const src = await (await fetch(JADUAL_HTML_URL, { cache: "no-cache" })).text();
    _versi = await bacaJadualHtml(src);
    tunjukVersi();
  } catch (e) {
    modal(`<h2>Import daripada jadual.html</h2>
      <p class="muted">Tidak dapat membaca jadual.html secara automatik (${esc(e.message)}). Pilih fail jadual.html dari komputer:</p>
      <input type="file" id="fJadual" accept=".html,.htm"><div class="row" style="margin-top:12px"><button data-tutup>Tutup</button></div>`, b => {
      $("#fJadual", b).onchange = async ev => { try { _versi = await bacaJadualHtml(await ev.target.files[0].text()); tunjukVersi(); } catch (x) { toast(x.message); } };
    });
  }
}
function tunjukVersi() {
  modal(`<h2>Import daripada jadual.html</h2>
    <label class="f">Versi<select id="iv">${_versi.versions.map(v => `<option value="${esc(v.id)}" ${v.id === _versi.lalai ? "selected" : ""}>${esc(v.label)}${v.id === _versi.lalai ? " (semasa)" : ""}</option>`).join("")}</select></label>
    <div class="list" style="margin-top:10px">
      <label class="item"><input type="radio" name="im" value="kekal" checked><div class="t"><b>Kekalkan kedudukan</b><span class="muted small">Edit jadual sedia ada (drag & drop), atau jana semula sebahagian.</span></div></label>
      <label class="item"><input type="radio" name="im" value="kosong"><div class="t"><b>Agihan sahaja</b><span class="muted small">Semua kad dikosongkan — sedia untuk dijana semula sepenuhnya.</span></div></label>
    </div>
    <p class="note">Projek semasa di peranti ini akan diganti dengan data import.</p>
    <div class="row"><button class="pri" id="bIm">Import</button><button data-tutup>Batal</button></div>`, b => {
    $("#bIm", b).onclick = () => {
      const v = _versi.versions.find(x => x.id === $("#iv", b).value);

      pilihKad = null; tutupModal(); ditukar(); render();
      toast(`Diimport: ${P.guru.length} guru, ${P.kelas.length} kelas, ${P.pelajaran.length} pelajaran`);
    };
  });
}

/* --- import agihan --- */
async function ambilAgihanGuru() {
  const h = { apikey: AGIHAN_KEY, Authorization: "Bearer " + AGIHAN_KEY };
  // Fungsi agihan_untuk_jana(): kelas, subjek, guru & waktu sahaja (sistem Agihan sendiri wajib log masuk)
  const r = await fetch(AGIHAN_URL + "/rest/v1/rpc/agihan_untuk_jana", { method: "POST", headers: { ...h, "Content-Type": "application/json" }, body: "{}" });
  if (!r.ok) throw new Error("Agihan Guru: HTTP " + r.status);
  const d = await r.json();
  return { versi: d.versi?.nama || "", agihan: d.agihan || [], guruKelas: (d.guruKelas || []).map(k => ({ kod: E.kodKelasAgihan(k.kelas), guru: k.guru || "" })) };
}
async function importDariAgihanGuru(ganti) {
  const d = await ambilAgihanGuru();
  const rows = E.barisDariAgihanGuru(d.agihan, P);
  if (!rows.length) return toast("Tiada data dalam Agihan Guru");
  snap();
  const lap = E.importAgihan(P, rows, ganti);
  let gk = 0;
  for (const g of d.guruKelas) { const k = P.kelas.find(x => String(x.kod).toUpperCase() === g.kod.toUpperCase()); if (k && g.guru && k.guruKelas !== g.guru) { k.guruKelas = g.guru; gk++; } }
  tutupModal(); ditukar(); render();
  modal(`<h2>Import dari Agihan Guru selesai</h2>${d.versi ? `<p class="muted small" style="margin-top:0">Versi: <b>${esc(d.versi)}</b> (versi semasa)</p>` : ""}<p>${lap.tambah} pelajaran ${ganti ? "(agihan lama diganti)" : "ditambah"}. Baharu: ${lap.kelasBaru} kelas, ${lap.guruBaru} guru, ${lap.subjekBaru} subjek.${gk ? ` Guru kelas dikemas kini: ${gk}.` : ""}</p>
    ${lap.guruBaru ? `<p class="muted small">Guru baharu mungkin ejaan berbeza daripada senarai sedia ada — semak di tab Guru.</p>` : ""}
    ${lap.ralat.length ? `<p class="pill bad">${lap.ralat.length} ralat</p><ul class="small">${lap.ralat.slice(0, 30).map(x => `<li>${esc(x)}</li>`).join("")}</ul>` : ""}
    <div class="row"><button data-tutup class="pri">OK</button></div>`);
}

document.addEventListener("change", e => {
  if (tab !== "tetapan" || !e.target.closest("#isi")) return;
  const el = e.target, t = P.tetapan;
  snap();
  if (el.dataset.lc !== undefined) {
    const arr = +el.dataset.lt >= 0 ? t.tahap[+el.dataset.lt].slotMasa : t.slotMasa;
    arr[+el.dataset.lc][el.dataset.k] = el.value;
    // tamat slot ini = mula slot seterusnya jika masih bersambung
  } else if (el.dataset.hb !== undefined) {
    const h = t.hubungan[+el.dataset.hb];
    const kod = el.value.split(/[,\s]+/).map(x => x.trim().toUpperCase()).filter(Boolean);
    const tak = kod.filter(k => !P.subjek.some(x => x.kod.toUpperCase() === k));
    if (tak.length) toast("Subjek tidak dijumpai: " + tak.join(", "));
    h.subjek = kod.map(k => (P.subjek.find(x => x.kod.toUpperCase() === k) || {}).id).filter(Boolean);
  } else if (el.dataset.th !== undefined) {
    const th = t.tahap[+el.dataset.th], k = el.dataset.k;
    if (k === "loceng") { if (el.checked) th.slotMasa = E.locengTahap(t, null).map(x => ({ ...x })); else delete th.slotMasa; }
    if (k === "nama") th.nama = el.value;
    if (k === "tahun") th.tahun = el.value.split(/[,\s]+/).map(Number).filter(Boolean);
    if (k === "rehat") th.rehat = el.value.split(",").map(x => x.trim()).filter(Boolean).map(x => { const [m, s] = x.split("-").map(y => y.trim()); return { mula: m, tamat: s }; }).filter(r => r.mula && r.tamat);
    if (k === "tamat") { th.tamat = th.tamat || {}; th.tamat[el.dataset.h] = el.value; }
  } else if (el.dataset.ac !== undefined) {
    const a = t.acara[+el.dataset.ac], k = el.dataset.k;
    if (k === "hari" || k === "tahap") a[k] = el.value.split(/[,\s]+/).map(x => x.trim().toUpperCase()).filter(Boolean);
    else a[k] = el.value;
  } else {
    const id = el.id;
    if (id === "sHari") t.hari = el.value.split(/[,\s]+/).map(x => x.trim().toUpperCase()).filter(Boolean);
    if (id === "sMula" || id === "sMinit") {
      if (!confirm("Ini akan mengosongkan kedudukan semua kad. Teruskan?")) { render(); return; }
      if (id === "sMula") t.mulaGrid = el.value; else t.minitSlot = Math.max(10, +el.value || 30);
      P.kad.forEach(c => { c.hari = -1; c.slot = -1; });

    if (id === "sMaksBlok") t.maksBlokSehari = Math.max(1, +el.value || 1);
    if (id === "sBerturut") t.maksBerturutGuru = Math.max(1, +el.value || 4);
    if (id === "sPagi") t.subjekPagi = el.value.split(/[,\s]+/).map(x => x.trim().toUpperCase()).filter(Boolean);
    if (id === "sLelaran") t.lelaran = Math.max(1000, +el.value || 60000);
  }

});
function buangKadLuarGrid() {
  // selepas tetapan berubah, keluarkan kad yang kini berada di slot tidak sah
  const S = E.bilSlot(P.tetapan), D = P.tetapan.hari.length;
  const pel = Object.fromEntries(P.pelajaran.map(p => [p.id, p]));
  const av = Object.fromEntries(P.kelas.map(k => [k.id, E.availKelas(P.tetapan, k)]));
  for (const c of P.kad) {
    if (c.hari < 0) continue;
    const p = pel[c.pel]; let ok = c.hari < D && c.slot + c.len <= S && p && E.kelasPel(p).every(k => av[k]);
    if (ok) for (const kl of E.kelasPel(p)) for (let k = 0; k < c.len; k++) if (!av[kl][c.hari][c.slot + k]) ok = false;
    if (!ok) { c.hari = -1; c.slot = -1; }
  }
}
function tambahTahap() { snap(); P.tetapan.tahap.push({ id: E.uid("T"), nama: "Tahap baharu", tahun: [], tamat: {}, rehat: [] }); ditukar(); render(); }
function padamTahap(i) { if (P.tetapan.tahap.length < 2) return toast("Perlu sekurang-kurangnya satu tahap"); if (!confirm("Padam tahap ini?")) return; snap(); P.tetapan.tahap.splice(i, 1); buangKadLuarGrid(); ditukar(); render(); }
function tambahAcara() { snap(); P.tetapan.acara.push({ id: E.uid("a"), nama: "ACARA", hari: [], mula: P.tetapan.mulaGrid, tamat: E.masaSlot(P.tetapan, 1), tahap: [], guru: "" }); ditukar(); render(); }
function jadualLoceng(arr, ti) {
  return `<div class="scroll"><table class="simple loceng"><tr><th>Waktu</th><th>Mula</th><th>Tamat</th><th class="num">Minit</th></tr>${arr.map((x, i) => `<tr><td>${i + 1}</td>
    <td><input type="time" data-lc="${i}" data-lt="${ti}" data-k="mula" value="${esc(x.mula)}"></td><td><input type="time" data-lc="${i}" data-lt="${ti}" data-k="tamat" value="${esc(x.tamat)}"></td>
    <td class="num">${E.toMin(x.tamat) - E.toMin(x.mula)}</td></tr>`).join("")}</table></div>`;
}
function ubahLoceng(aksi) {
  const t = P.tetapan; snap();
  if (aksi === "sesuai") t.slotMasa = E.slotSeragam(t);
  if (aksi === "seragam") { if (!confirm("Kembali ke grid seragam? Waktu loceng khas (termasuk tahap) akan dibuang.")) return; delete t.slotMasa; t.tahap.forEach(th => delete th.slotMasa); }
  if (aksi === "tambah" || aksi === "buang") {
    const ubah = arr => { if (aksi === "buang") arr.pop(); else { const l = arr[arr.length - 1]; const len = E.toMin(l.tamat) - E.toMin(l.mula); arr.push({ mula: l.tamat, tamat: E.toHHMM(E.toMin(l.tamat) + len) }); } };
    ubah(t.slotMasa); t.tahap.forEach(th => { if (th.slotMasa) ubah(th.slotMasa); });
  }
  buangKadLuarGrid(); ditukar(); render();
}
function tambahHubungan() { snap(); (P.tetapan.hubungan = P.tetapan.hubungan || []).push({ id: E.uid("h"), jenis: "bukanHariSama", subjek: [] }); ditukar(); render(); }

let cariGuru = "";
function miniGrid(fn) {

function tGuru() {

function gridTiadaHTML(sel) {

// ikat grid masa tidak tersedia: ketik petak, ketik hari (baris) atau waktu (lajur)
function ikatGridTiada(b, sel) {
  const set = (tds) => { const semua = tds.every(td => sel.has(td.dataset.k)); tds.forEach(td => { if (semua) sel.delete(td.dataset.k); else sel.add(td.dataset.k); td.classList.toggle("on", !semua); }); };

      if (lamaPec !== pec.join("+")) P.kad = P.kad.filter(c => c.pel !== p.id);
      tutupModal(); ditukar(); render();
    };
    if (id) $("#pDel", b).onclick = () => { if (!confirm("Padam pelajaran ini?")) return; snap(); P.pelajaran = P.pelajaran.filter(x => x.id !== id); P.kad = P.kad.filter(c => c.pel !== id); tutupModal(); ditukar(); render(); };
  });
}

function mulaJana() {
  if (!P.kad.length) return toast("Tiada agihan untuk dijana");
  snap();
  const teruskan = ($("input[name=mj]:checked") || {}).value === "baki";
  const g = E.Penjana(P, { teruskan });
  const t0 = performance.now();
  janaJalan = { g, henti: false };
  render();
  const jumlah = P.kad.length;
  const pusing = () => {
    if (!janaJalan) return;
    const lagi = janaJalan.henti ? false : g.jalan(150);
    const dl = jumlah - g.U.size - g.mustahil.size;
    const bar = $("#progJana"); if (bar) bar.style.width = Math.round(dl / jumlah * 100) + "%";
    const inf = $("#infoJana"); if (inf) inf.textContent = `${dl}/${jumlah} diletak • lelaran ${g.iter}`;
    if (lagi) return setTimeout(pusing, 0);
    const r = g.tamat();
    E.kemaskan(g.st, 2500);
    r.ms = performance.now() - t0; hasilJana = r; janaJalan = null;
    ditukar(); render();
    toast(r.belum ? `${r.belum} kad belum diletak` : "Jadual lengkap ✓");
  };
  setTimeout(pusing, 30);
}
function hentiJana() { if (janaJalan) janaJalan.henti = true; }

/* ================= Tab: Jadual (editor) ================= */
function lihatEntiti(jenis, id) { paparan = { jenis, id }; tab = "jadual"; pilihKad = null; render(); window.scrollTo(0, 0); }
function senaraiEntiti(jenis) {
  if (jenis === "kelas") return P.kelas.slice().sort((a, b) => a.kod.localeCompare(b.kod)).map(k => [k.id, k.kod + (k.nama ? " " + k.nama : "")]);
  if (jenis === "guru") return P.guru.slice().sort((a, b) => a.nama.localeCompare(b.nama)).map(g => [g.id, g.nama]);
  return P.bilik.map(b => [b.id, b.nama]);
}
function kadEntiti(jenis, id) {
  return P.kad.filter(c => { const p = st.pel[c.pel]; if (!p) return false; return jenis === "kelas" ? E.kelasPel(p).includes(id) : jenis === "guru" ? p.guru.includes(id) : bilikKad(c, p) === id; });
}
function labelBlok(k, d, s) {
  const t = P.tetapan, th = E.tahapKelas(t, k), h = t.hari[d];
  const a = E.toMin(E.masaSlot(t, s, th)), b = E.toMin(E.masaTamat(t, s, th));
  if (th) for (const r of th.rehat || []) if (a < E.toMin(r.tamat) && b > E.toMin(r.mula)) return "REHAT";
  for (const e of t.acara || []) { if (!(e.hari || []).includes(h)) continue; if (e.tahap && e.tahap.length && th && !e.tahap.includes(th.id)) continue; if (a < E.toMin(e.tamat) && b > E.toMin(e.mula)) return e.nama; }
  if (k && (k.tiada || []).includes(h + "|" + s)) return "—";

}
function kandunganKad(c, jenis) {

}
function tJadual() {
  if (/^induk/.test(paparan.jenis)) return tInduk();

  const t = P.tetapan, S = E.bilSlot(t), D = t.hari.length;

  let grid = `<p class="muted">Tiada data. Tambah ${paparan.jenis} dahulu.</p>`, tray = "";
  if (paparan.id) {
    const kads = kadEntiti(paparan.jenis, paparan.id);
    const mula = {}, tutup = {}, serentak = {};
    kads.forEach(c => { if (c.hari >= 0) { const key = c.hari + "|" + c.slot; if (!mula[key]) { mula[key] = c; for (let k = 1; k < c.len; k++) tutup[c.hari + "|" + (c.slot + k)] = true; } else (serentak[key] = serentak[key] || []).push(c); } });
    const k = paparan.jenis === "kelas" ? byId(P.kelas, paparan.id) : null;

      for (let d = 0; d < D; d++) {

    const belum = kads.filter(c => c.hari < 0);
    tray = belum.length ? `<h3>Belum diletak (${belum.length})</h3><div class="tray">${belum.map(c => { const p = st.pel[c.pel], sb = subjekOf(p.subjek); return `<span class="chip ${pilihKad === c.id ? "pilih" : ""}" draggable="true" data-kad="${c.id}" style="background:${esc(sb.warna)}">${esc(sb.kod)} ${paparan.jenis !== "kelas" ? esc(namaKelasP(p)) : ""} • ${c.len}</span>`; }).join("")}</div>` : "";
    const bil = kads.reduce((a, c) => a + (c.hari >= 0 ? c.len : 0), 0);

  }

    <div class="row">

      <span class="muted small">${idx + 1}/${list.length}</span></div>
  </div>`;
}
const JENIS_JADUAL = [["induk-guru", "Semua guru (induk)"], ["induk-kelas", "Semua kelas (induk)"], ["induk-bilik", "Semua bilik (induk)"], ["kelas", "Satu kelas"], ["guru", "Satu guru"], ["bilik", "Satu bilik"]];
let indukHari = -1; // -1 = semua hari
/* Paparan induk (gaya aSc): baris = semua guru / semua kelas, lajur = hari × waktu */
function barisInduk(jenis) {
  if (jenis === "induk-bilik") return P.bilik.map(b => ({ id: b.id, lbl: b.nama, nama: b.nama, occ: st.bilikOcc[b.id], tiada: st.tiadaBilik[b.id] }));

    : P.kelas.slice().sort((a, b) => a.kod.localeCompare(b.kod)).map(k => ({ id: k.id, lbl: k.kod, nama: k.kod + (k.nama ? " " + k.nama : ""), occ: st.kelasOcc[k.id], av: st.avail[k.id] }));

function tInduk() {

    const kolab = p.guru.length > 1;
    const tip = `${sb.kod} ${namaKelasP(p)} • ${p.guru.map(singGuru).join(" / ")} • ${t.hari[c.hari]} ${E.masaSlot(t, c.slot)} (${c.len} masa)${c.kunci ? " • berkunci" : ""}`;
    return `<div class="kad ki ${kolab ? "kolab" : ""} ${pilihKad === c.id ? "pilih" : ""} ${isuSet.has(c.id) ? "isu" : ""}" draggable="true" data-kad="${c.id}" title="${esc(tip)}" style="background:${esc(sb.warna)}">${esc(teks)}${c.kunci ? `<span class="kunci"><i class="fa-solid fa-lock"></i></span>` : ""}</div>`; };

  for (const r of rows) {
    const bil = P.kad.reduce((a, c) => { const p = st.pel[c.pel]; return a + (p && (jenis === "induk-guru" ? p.guru.includes(r.id) : jenis === "induk-bilik" ? bilikKad(c, p) === r.id : E.kelasPel(p).includes(r.id)) ? c.len : 0); }, 0);
    h += `<tr><th class="rh" data-baris="${r.id}" title="${esc(r.nama)} — ${bil} masa"><span>${esc(r.lbl)}</span><em>${bil}</em></th>`;
    for (const d of hariL) {
      for (let x = 0; x < S; x++) {
        const id = r.occ && r.occ[d][x];
        const cls = x === 0 ? "d0" : "";
        if (id) {
          const c = st.kad[id];
          if (c.slot !== x && x !== 0) continue; // sudah diliputi colspan
          const span = Math.min(c.len - (x - c.slot), S - x);
          const lain = jenis === "induk-kelas" && st.kelasKump[r.id] ? Object.keys(st.kelasKump[r.id][d][x]).length - 1 : 0;
          h += `<td colspan="${span}" class="${cls}" data-e="${r.id}" data-d="${d}" data-s="${x}"${lain > 0 ? ` title="${lain + 1} kumpulan serentak"` : ""}>${kadDi(c, r.id)}${lain > 0 ? `<span class="kplus">+${lain}</span>` : ""}</td>`;
          x += span - 1;

          h += `<td class="${cls}${blk ? " blk" : ""}${td ? " tiada" : ""}" data-e="${r.id}" data-d="${d}" data-s="${x}"></td>`;
        }

    h += `</tr>`;

  return `<div class="card">
    <div class="row">
      <select id="jJenis">${JENIS_JADUAL.map(([v, n]) => `<option value="${v}" ${paparan.jenis === v ? "selected" : ""}>${n}</option>`).join("")}</select>

      <span class="muted small grow">${rows.length} ${jenis === "induk-guru" ? "guru" : jenis === "induk-bilik" ? "bilik" : "kelas"} • ketik nama untuk senarai pelajaran</span>
    </div>

  </div>`;
}
function dlgKontrak(jenis, id) {

  const rows = pel.map(p => { const sb = subjekOf(p.subjek), kads = st.kadPel[p.id] || [], m = Number(p.masa || 0); jum += m;

  modal(`<h3 style="margin-top:0">${isSub ? "Pelajaran subjek" : isGuru ? "Kontrak guru" : "Pelajaran kelas"}: ${esc(nama)}</h3>
    <div class="scroll kontrak-sc"><table class="simple"><thead><tr><th>Subjek</th><th>Guru</th><th>Kelas</th><th class="num">Masa</th><th>Pecahan</th><th class="num">Diletak</th></tr></thead><tbody>${rows || `<tr><td colspan="6" class="muted">Tiada pelajaran</td></tr>`}</tbody>
    <tfoot><tr><th colspan="3" style="text-align:right">Jumlah</th><th class="num">${jum}</th><th></th><th class="num">${letak}</th></tr></tfoot></table></div>

    });
}
function kunciSemuaEntiti(v) { if (!paparan.id) return; snap(); kadEntiti(paparan.jenis, paparan.id).forEach(c => { if (c.hari >= 0) c.kunci = v; }); ditukar(); render(); }

function lepasRenderJadual() {
  const isi = $("#isi");
  const tukarId = id => { paparan.id = id; pilihKad = null; render(); };
  const jj = $("#jJenis"); if (jj) jj.onchange = e => { paparan = { jenis: e.target.value, id: null }; pilihKad = null; render(); };
  const jh = $("#jHari"); if (jh) jh.onchange = e => { indukHari = +e.target.value; render(); };
  $$(".tt.induk th[data-baris]").forEach(th => th.onclick = () => paparan.jenis === "induk-bilik" ? lihatEntiti("bilik", th.dataset.baris) : dlgKontrak(paparan.jenis, th.dataset.baris));
  const ji = $("#jId"); if (ji) ji.onchange = e => tukarId(e.target.value);
  const list = senaraiEntiti(paparan.jenis), idx = list.findIndex(x => x[0] === paparan.id);
  const jp = $("#jPrev"); if (jp) jp.onclick = () => list.length && tukarId(list[(idx - 1 + list.length) % list.length][0]);
  const jn = $("#jNext"); if (jn) jn.onclick = () => list.length && tukarId(list[(idx + 1) % list.length][0]);
  tandaPetak();
}
function tandaPetak() {
  $$(".tt td").forEach(td => td.classList.remove("boleh", "tukar"));
  if (!pilihKad) return;
  const c = st.kad[pilihKad]; if (!c) return;
  const p = st.pel[c.pel]; if (!p) return;
  // hanya tandakan jika paparan semasa berkaitan dengan kad
  const induk = /^induk/.test(paparan.jenis);
  const kait = induk || (paparan.jenis === "kelas" ? E.kelasPel(p).includes(paparan.id) : paparan.jenis === "guru" ? p.guru.includes(paparan.id) : bilikKad(c, p) === paparan.id);
  if (!kait) return;
  const baris = paparan.jenis === "induk-guru" ? p.guru : paparan.jenis === "induk-kelas" ? E.kelasPel(p) : paparan.jenis === "induk-bilik" ? E.bilikCalon(p) : null;
  const d0 = c.hari, s0 = c.slot;
  if (d0 >= 0) E.cabut(st, c);
  for (let d = 0; d < st.D; d++) for (let s = 0; s + c.len <= st.S; s++) {
    const k = E.pertembungan(st, c, d, s); if (!k) continue;
    if (k.some(id => st.kad[id].kunci)) continue;
    if (d === d0 && s === s0) continue;
    const tds = baris ? baris.map(e => $(`.tt td[data-e="${e}"][data-d="${d}"][data-s="${s}"]`)).filter(Boolean) : [$(`.tt td[data-d="${d}"][data-s="${s}"]`)].filter(Boolean);
    tds.forEach(td => td.classList.add(k.length ? "tukar" : "boleh"));
  }
  if (d0 >= 0) E.pasang(st, c, d0, s0);
}
function letakKad(id, d, s) {
  const c = st.kad[id]; if (!c) return;
  const d0 = c.hari, s0 = c.slot;
  if (d0 >= 0) E.cabut(st, c);
  const k = E.pertembungan(st, c, d, s);
  if (!k || k.some(x => st.kad[x].kunci)) { if (d0 >= 0) E.pasang(st, c, d0, s0); return toast("Tidak boleh diletak di situ"); }
  snap();
  const lain = k.map(x => st.kad[x]);
  lain.forEach(o => E.cabut(st, o));
  E.pasang(st, c, d, s);
  // tukar automatik: jika satu kad ditolak dan muat di tempat asal kad ini
  let msg = "";
  if (lain.length === 1 && d0 >= 0) {
    const o = lain[0], kk = E.pertembungan(st, o, d0, s0);
    if (kk && kk.length === 0) { E.pasang(st, o, d0, s0); msg = "Ditukar ✓"; }
  }
  if (!msg && lain.length) msg = lain.length + " kad dipindah ke senarai belum diletak";
  pilihKad = null; ditukar(); render(); if (msg) toast(msg);
}
$("#isi").addEventListener("click", e => {
  if (tab !== "jadual") return;
  const td = e.target.closest(".tt td");
  if (pilihKad && td && (td.classList.contains("boleh") || td.classList.contains("tukar"))) { letakKad(pilihKad, +td.dataset.d, +td.dataset.s); return; }
  const kad = e.target.closest("[data-kad]");
  if (kad) { pilihKad = pilihKad === kad.dataset.kad ? null : kad.dataset.kad; $$("[data-kad]").forEach(x => x.classList.toggle("pilih", x.dataset.kad === pilihKad)); tandaPetak(); kemasBar(); return; }
  if (pilihKad && td) toast("Petak ini tidak sesuai untuk kad dipilih");
});
$("#isi").addEventListener("dragstart", e => {
  const kad = e.target.closest("[data-kad]"); if (!kad || tab !== "jadual") return;
  pilihKad = kad.dataset.kad; e.dataTransfer.setData("text/plain", pilihKad); e.dataTransfer.effectAllowed = "move";
  setTimeout(() => { tandaPetak(); kemasBar(); }, 0);
});
$("#isi").addEventListener("dragover", e => { const td = e.target.closest(".tt td"); if (td && (td.classList.contains("boleh") || td.classList.contains("tukar"))) e.preventDefault(); });
$("#isi").addEventListener("drop", e => { const td = e.target.closest(".tt td"); if (!td || !pilihKad) return; e.preventDefault(); letakKad(pilihKad, +td.dataset.d, +td.dataset.s); });

function kemasBar() {
  const bar = $("#bar");
  if (tab !== "jadual" || !pilihKad || !st.kad[pilihKad]) { bar.classList.remove("on"); return; }
  const c = st.kad[pilihKad], p = st.pel[c.pel];
  $("#barTeks").innerHTML = `<b>${esc(subjekOf(p.subjek).kod)} ${esc(namaKelasP(p))}</b> • ${c.len} masa • ${esc(p.guru.map(singGuru).join(" / "))}${bilikKad(c, p) ? " • " + esc(namaBilik(bilikKad(c, p))) : ""}`;
  const bc = E.bilikCalon(p), bb = $("#barBilik");
  if (bc.length > 1 && c.hari >= 0) {
    bb.innerHTML = bc.map(id => { const lain = c.hari >= 0 && Array.from({ length: c.len }, (_, k) => st.bilikOcc[id] && st.bilikOcc[id][c.hari][c.slot + k]).some(x => x && x !== c.id);
      return `<option value="${id}" ${id === c.bilik ? "selected" : ""}>${esc(namaBilik(id))}${lain ? " (digunakan)" : ""}</option>`; }).join("");
    bb.style.display = "";
  } else bb.style.display = "none";
  $("#barKunci").innerHTML = c.kunci ? `<i class="fa-solid fa-lock-open"></i> Buka kunci` : `<i class="fa-solid fa-lock"></i> Kunci`;
  $("#barKunci").disabled = c.hari < 0;
  $("#barKeluar").disabled = c.hari < 0 || c.kunci;
  bar.classList.add("on");
}
$("#barBatal").onclick = () => { pilihKad = null; render(); };
$("#barBilik").onchange = e => {
  const c = st.kad[pilihKad]; if (!c || c.hari < 0) return;
  const id = e.target.value, sibuk = Array.from({ length: c.len }, (_, k) => st.bilikOcc[id] && st.bilikOcc[id][c.hari][c.slot + k]).some(x => x && x !== c.id);
  if (sibuk) { toast("Bilik itu sedang digunakan pada masa ini"); kemasBar(); return; }
  snap(); c.bilik = id; ditukar(); render();
};
$("#barKunci").onclick = () => { const c = st.kad[pilihKad]; if (!c) return; snap(); c.kunci = !c.kunci; ditukar(); render(); };
$("#barKeluar").onclick = () => { const c = st.kad[pilihKad]; if (!c || c.kunci) return; snap(); E.cabut(st, c); ditukar(); render(); };

/* ================= Tab: Cetak & Terbit ================= */
function tCetak() {
  const isu = E.semakSemua(P).length, belum = P.kad.filter(c => c.hari < 0).length;
  const vid = "v" + new Date().toISOString().slice(2, 10).replace(/-/g, "");
  return `<div class="card"><h2>Cetak</h2><p class="muted small" style="margin-top:0">A4 landskap, satu kelas/guru setiap muka. Pilih "Simpan sebagai PDF" untuk PDF.</p>
    <div class="row"><button onclick="cetak('kelas')"><i class="fa-solid fa-print"></i> Semua kelas</button><button onclick="cetak('guru')"><i class="fa-solid fa-print"></i> Semua guru</button>
    <button onclick="cetak('kelas',true)">Kelas dipaparkan</button><button onclick="cetak('induk')"><i class="fa-solid fa-print"></i> Jadual induk guru</button>${P.bilik.length ? `<button onclick="cetak('bilik')"><i class="fa-solid fa-print"></i> Semua bilik</button>` : ""}</div></div>
  <div class="card"><h2>Terbit ke ICT HUB</h2>
    ${isu || belum ? `<p class="pill ${isu ? "bad" : "warn"}">${isu ? isu + " pertembungan" : ""} ${belum ? belum + " kad belum diletak" : ""}</p>` : `<p class="pill ok">Jadual lengkap & tiada pertembungan</p>`}
    <div class="grid2" style="margin-top:8px"><label class="f">ID versi<input id="vId" value="${vid}"></label><label class="f">Label<input id="vLabel" value="${esc(P.nama)} — ${new Date().toLocaleDateString("ms-MY")}"></label></div>
    <label class="row small" style="margin-top:8px"><input type="checkbox" id="vSemasa" checked> Jadikan versi semasa (Supabase)</label>
    <div class="row" style="margin-top:10px">
      <button class="pri" onclick="terbitAwan()"><i class="fa-solid fa-cloud-arrow-up"></i> Terbit ke Supabase</button>
      <button onclick="salinBlokVersi()"><i class="fa-solid fa-copy"></i> Salin blok untuk jadual.html</button>
      <button onclick="muatTurunEksport()"><i class="fa-solid fa-download"></i> JSON jadual</button>
    </div>
    <p class="muted small">Untuk jadual.html: tampal blok yang disalin ke dalam <code>VERSION_DATA</code> (sebelum <code>];</code>) dan tukar <code>DEFAULT_VERSION_ID</code>. Guru Ganti, Kehadiran & jadual-push akan terus menggunakan versi baharu.</p></div>
  <div class="card"><h2>Sandaran projek</h2><div class="row">
    <button onclick="muatTurun((P.nama||'projek')+'.jadual.json',JSON.stringify(P),'application/json')"><i class="fa-solid fa-download"></i> Muat turun projek</button>
    <label class="btn"><i class="fa-solid fa-upload"></i> Buka fail projek<input type="file" accept=".json" style="display:none" onchange="bukaFailProjek(this.files[0])"></label></div></div>`;
}
function muatTurun(nama, isi, jenis) { const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([isi], { type: jenis })); a.download = nama; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000); }
async function bukaFailProjek(f) { if (!f) return; try { const j = JSON.parse(await f.text()); if (!j.tetapan || !j.kad) throw new Error("Bukan fail projek Jana Jadual"); snap(); P = j; delete P._awanId; ditukar(); render(); toast("Projek dibuka"); } catch (e) { toast(e.message); } }
function blokVersi() {
  const id = ($("#vId") || {}).value || "vbaru", label = ($("#vLabel") || {}).value || P.nama;
  return { id, label, shortLabel: label.slice(0, 40), data: E.eksportJadualHtml(P) };
}
function muatTurunEksport() { const v = blokVersi(); muatTurun(v.id + "-jadual.json", JSON.stringify(v.data), "application/json"); }
async function salinBlokVersi() {
  const v = blokVersi(), teks = "  " + JSON.stringify(v) + ",";
  try { await navigator.clipboard.writeText(teks); toast("Blok disalin ✓ — tampal ke VERSION_DATA dalam jadual.html"); }
  catch (e) { modal(`<h2>Salin blok</h2><textarea readonly>${esc(teks)}</textarea><div class="row"><button data-tutup>Tutup</button></div>`); }
}
async function terbitAwan() {
  try {
    if (E.semakSemua(P).length && !confirm("Jadual masih ada pertembungan. Terbit juga?")) return;
    const k = await pastikanKunci(), v = blokVersi();
    if (!P._awanId) await simpanAwan();
    await rpc("tt_terbitkan", { p_kunci: k, p_id: v.id, p_label: v.label, p_projek: P._awanId || null, p_data: v.data, p_semasa: $("#vSemasa").checked });
    toast("Diterbitkan ke Supabase ✓ (" + v.id + ")");
  } catch (e) { toast("Gagal terbit: " + e.message, 4500); }
}

function htmlCetakEntiti(jenis, id) {
  const t = P.tetapan, S = E.bilSlot(t);
  const k = jenis === "kelas" ? byId(P.kelas, id) : null, g = jenis === "guru" ? byId(P.guru, id) : null;
  const av = k ? E.availKelas(t, k) : null;
  const kads = kadEntiti(jenis, id).filter(c => c.hari >= 0);
  const bl = jenis === "bilik" ? byId(P.bilik, id) : null, thK = k ? E.tahapKelas(t, k) : null;
  const tajuk = k ? `JADUAL WAKTU KELAS ${esc(k.kod)} ${esc(k.nama || "")}` : bl ? `JADUAL BILIK` : `JADUAL WAKTU GURU`;
  const sub = k ? `Guru Kelas: ${esc(k.guruKelas || "-")}` : bl ? esc(bl.nama) : esc(g.nama);
  // acara sebelum grid (cth Kerohanian 06:30)
  const awal = k ? (t.acara || []).filter(a => E.toMin(a.tamat) <= E.toMin(t.mulaGrid) && (!a.tahap.length || a.tahap.includes((E.tahapKelas(t, k) || {}).id))) : [];
  let h = `<div class="pg"><h1>SK AGAMA (MIS) MIRI — ${tajuk}</h1><h2>${sub} • ${esc(P.nama)}</h2><table class="pt"><tr><th style="width:60px">HARI</th>${awal.length ? `<th style="width:78px">${esc(awal[0].mula)}-${esc(awal[0].tamat)}</th>` : ""}${Array.from({ length: S }, (_, s) => `<th>${E.masaSlot(t, s, thK)}<br>${E.masaTamat(t, s, thK)}</th>`).join("")}</tr>`;
  t.hari.forEach((hari, d) => {
    h += `<tr><th>${esc(hari)}</th>`;
    if (awal.length) { const a = awal.find(x => (x.hari || []).includes(hari)); h += `<td class="bk">${a ? esc(a.nama) : ""}</td>`; }
    for (let s = 0; s < S; s++) {
      const cs = kads.filter(x => x.hari === d && x.slot === s), c = cs[0];
      if (!c && kads.some(x => x.hari === d && x.slot < s && x.slot + x.len > s)) continue;
      if (c) {
        const isi = cs.map(x => { const p = st.pel[x.pel], sb = subjekOf(p.subjek), br = bilikKad(x, p);
          const b2 = jenis === "kelas" ? p.guru.map(singGuru).join(" / ") : namaKelasP(p) + (jenis === "bilik" ? " — " + p.guru.map(singGuru).join(" / ") : "");
          return `<b>${esc(sb.kod)}${jenis === "kelas" && p.kumpulan ? " (" + esc(p.kumpulan) + ")" : ""}</b>${esc(b2)}${br && jenis !== "bilik" ? "<br><small>" + esc(namaBilik(br)) + "</small>" : ""}`; }).join("<hr>");
        const len = Math.max(...cs.map(x => x.len));
        h += `<td colspan="${len}">${isi}</td>`; s += len - 1;
      } else if (av && !av[d][s]) {
        const lb = labelBlok(k, d, s);
        let n = 1; while (s + n < S && av && !av[d][s + n] && labelBlok(k, d, s + n) === lb && !kads.some(x => x.hari === d && x.slot === s + n)) n++;
        h += `<td class="bk" colspan="${n}">${esc(lb)}</td>`; s += n - 1;
      } else h += `<td></td>`;
    }
    h += `</tr>`;
  });
  h += `</table>`;
  if (k) {
    const pl = P.pelajaran.filter(p => E.kelasPel(p).includes(k.id)).sort((a, b) => subjekOf(a.subjek).kod.localeCompare(subjekOf(b.subjek).kod));
    h += `<div class="lg">${pl.map(p => `<div><b>${esc(subjekOf(p.subjek).kod)}</b> (${p.masa}) — ${esc(p.guru.map(namaGuru).join(" / "))}</div>`).join("")}</div>`;
  } else if (g) {
    h += `<div class="lg"><div>Jumlah: <b>${bebanGuru(g.id)} masa</b> seminggu</div></div>`;
  }
  return h + `</div>`;
}
function htmlInduk() {
  const t = P.tetapan, S = E.bilSlot(t);
  let out = "";
  t.hari.forEach((hari, d) => {
    let h = `<div class="pg"><h1>SK AGAMA (MIS) MIRI — JADUAL INDUK GURU</h1><h2>${esc(hari)} • ${esc(P.nama)}</h2><table class="pt"><tr><th style="width:170px">GURU</th>${Array.from({ length: S }, (_, s) => `<th>${E.masaSlot(t, s)}</th>`).join("")}</tr>`;
    P.guru.slice().sort((a, b) => a.nama.localeCompare(b.nama)).forEach(g => {
      h += `<tr><th style="text-align:left;font-size:8.5px">${esc(g.nama)}</th>`;
      for (let s = 0; s < S; s++) { const id = st.guruOcc[g.id] && st.guruOcc[g.id][d][s]; if (id) { const p = st.pel[st.kad[id].pel]; h += `<td style="height:18px;font-size:8px">${esc(namaKelasP(p))}<br>${esc(subjekOf(p.subjek).kod)}</td>`; } else h += `<td style="height:18px"></td>`; }
      h += `</tr>`;
    });
    out += h + `</table></div>`;
  });
  return out;
}
function cetak(jenis, satu) {
  bina();
  let h = "";
  if (jenis === "induk") h = htmlInduk();
  else if (satu) { if (paparan.jenis !== "kelas" || !paparan.id) return toast("Buka satu kelas di tab Jadual dahulu"); h = htmlCetakEntiti("kelas", paparan.id); }
  else senaraiEntiti(jenis).forEach(([id]) => h += htmlCetakEntiti(jenis, id));
  if (!h) return toast("Tiada data untuk dicetak");
  $("#cetak").innerHTML = h;
  setTimeout(() => window.print(), 50);
}

/* ================= Projek (awan) ================= */
$("#btnProjek").onclick = async () => {
  modal(`<h2>Projek</h2><p class="muted">Memuatkan…</p>`);
  let senarai = [], ralat = "";
  try { senarai = await sb("tt_projek?select=id,nama,dikemas_kini&order=dikemas_kini.desc"); } catch (e) { ralat = e.message; }
  modal(`<h2>Projek</h2>
    ${ralat ? `<p class="pill warn">${esc(ralat)}</p>` : ""}
    <div class="list">${senarai.map(p => `<div class="item"><div class="t"><b>${esc(p.nama)}${p.id === P._awanId ? " (sedang dibuka)" : ""}</b><span class="muted small">${new Date(p.dikemas_kini).toLocaleString("ms-MY")}</span></div>
      <button class="mini pri" data-buka="${p.id}">Buka</button><button class="mini red" data-padam="${p.id}"><i class="fa-solid fa-trash"></i></button></div>`).join("") || (ralat ? "" : `<p class="muted">Belum ada projek di awan.</p>`)}</div>
    <div class="row" style="margin-top:12px"><button id="bSalin"><i class="fa-solid fa-clone"></i> Simpan sebagai projek baharu</button></div>
    <h3>Sambungan Supabase</h3>
    <div class="grid2"><label class="f">URL projek<input id="cUrl" value="${esc(cfg.url)}"></label><label class="f">Anon / publishable key<input id="cKey" value="${esc(cfg.key)}"></label></div>
    <div class="row" style="margin-top:10px"><button id="bCfg">Simpan sambungan</button>${kunciAdmin ? `<button id="bLogout">Lupakan kata laluan admin</button>` : ""}<button data-tutup>Tutup</button></div>`, b => {
    $$("[data-buka]", b).forEach(x => x.onclick = async () => {
      if (berubah && !confirm("Perubahan pada projek semasa belum disimpan ke awan. Teruskan?")) return;
      try { const r = await sb("tt_projek?id=eq." + x.dataset.buka + "&select=*"); snap(); P = r[0].data; P._awanId = r[0].id; P.nama = r[0].nama; berubah = false; pilihKad = null; simpanTempatan(); tutupModal(); render(); toast("Projek dibuka"); }
      catch (e) { toast(e.message); }
    });
    $$("[data-padam]", b).forEach(x => x.onclick = async () => {
      if (!confirm("Padam projek ini dari awan? Tindakan ini kekal.")) return;
      try { await rpc("tt_padam", { p_kunci: await pastikanKunci(), p_id: x.dataset.padam }); if (P._awanId === x.dataset.padam) delete P._awanId; tutupModal(); $("#btnProjek").click(); } catch (e) { toast(e.message); }
    });
    $("#bSalin", b).onclick = async () => { const n = prompt("Nama projek baharu:", P.nama + " (salinan)"); if (!n) return; delete P._awanId; P.nama = n; tutupModal(); await simpanAwan(); render(); };
    $("#bCfg", b).onclick = () => { cfg = { url: $("#cUrl", b).value.trim(), key: $("#cKey", b).value.trim() }; tulisLS(K_CFG, cfg); toast("Sambungan disimpan"); tutupModal(); $("#btnProjek").click(); };
    const lo = $("#bLogout", b); if (lo) lo.onclick = () => { kunciAdmin = ""; try { sessionStorage.removeItem(K_KUNCI); } catch (e) {} toast("Kata laluan dilupakan"); tutupModal(); };
  });
};

window.addEventListener("beforeunload", e => { simpanTempatan(); });
render();
</script>
